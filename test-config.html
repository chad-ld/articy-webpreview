<!DOCTYPE html>
<html>
<head>
    <title>Configuration Test</title>
</head>
<body>
    <h1>Configuration System Test</h1>
    <p>Open browser console to see configuration loading logs.</p>
    
    <h2>Test Steps:</h2>
    <ol>
        <li>Clear localStorage: <button onclick="clearStorage()">Clear localStorage</button></li>
        <li>Reload page to simulate first-time user</li>
        <li>Check console for configuration loading messages</li>
        <li>Verify murderboard plugin is enabled by default</li>
    </ol>
    
    <h2>Current localStorage:</h2>
    <pre id="localStorage-content"></pre>
    
    <script>
        function clearStorage() {
            localStorage.removeItem('articy-plugin-state');
            updateDisplay();
            alert('localStorage cleared! Reload the page to test first-time user experience.');
        }
        
        function updateDisplay() {
            const content = localStorage.getItem('articy-plugin-state');
            document.getElementById('localStorage-content').textContent = 
                content ? JSON.stringify(JSON.parse(content), null, 2) : 'No plugin state found';
        }
        
        // Update display on load
        updateDisplay();
        
        // Test configuration loading
        async function testConfig() {
            try {
                const response = await fetch('./config.json');
                const config = await response.json();
                console.log('✅ Configuration loaded:', config);
                console.log('📋 Default plugins:', config.plugins.defaultEnabled);
            } catch (error) {
                console.error('❌ Failed to load config:', error);
            }
        }
        
        testConfig();
    </script>
</body>
</html>
